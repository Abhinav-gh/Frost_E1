[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frost-edge-caching"
version = "0.2.0"
description = "Reproducible experiments for edge-message reuse in MACE"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "ase>=3.22", "matplotlib>=3.7", "pandas>=2.0", "PyYAML>=6", "tqdm>=4.65"]

[tool.setuptools.packages.find]
include = ["frost*", "analysis*"]
